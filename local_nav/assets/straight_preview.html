<div id="straight-route-preview">

    <polygon points="FLOOR_POLYGON" fill="var(--viz-series-1)" fill-opacity="0.2" stroke="var(--viz-series-1)" stroke-width="2"/>
    <path d="FLOOR_LINE" stroke="var(--viz-series-1)" stroke-width="4" fill="none"/>

      <rect x="130" y="TARGET_Y" width="60" height="75" stroke="var(--viz-series-1)" stroke-width="2" fill="none"/>
      <path d="M 160 170 L 160 TARGET_Y" stroke="var(--viz-series-1)" stroke-width="3"/>
      <circle cx="160" cy="TARGET_Y" r="5" fill="var(--viz-series-1)"/>
    </svg>
    <div><div>Solid: current 12 × 15 cm chassis</div><div>Outline: chassis at target</div><div>Dot: lens goal position</div><div>Shaded: chassis, clearance and motion allowances</div></div>
  </div>
